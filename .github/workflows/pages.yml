# نشر واجهات البوتات (webroot) على GitHub Pages تلقائياً
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# تشغيل واحد منشور في نفس الوقت
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload webroot artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ملاحظة: stats.json مُستثنى من git (بيانات تشغيلية) والصفحات تعمل بدونه عبر fallback مدمج
          path: webroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
