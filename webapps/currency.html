:root{
  /* ── ألوان تُضبط من Telegram.themeParams (تُحدَّث من JS أيضاً) ── */
  --bd-bg:        var(--tg-theme-bg-color, #0f141a);
  --bd-surface:   var(--tg-theme-secondary-bg-color, #1a212a);
  --bd-surface-2: var(--tg-theme-section-separator-color, rgba(255,255,255,.08));
  --bd-text:      var(--tg-theme-text-color, #eef2f7);
  --bd-hint:      var(--tg-theme-hint-color, #93a4b8);
  --bd-link:      var(--tg-theme-link-color, #62bcf9);
  --bd-btn:       var(--tg-theme-button-color, var(--bd-brand));
  --bd-btn-text:  var(--tg-theme-button-text-color, #ffffff);
  --bd-danger:    #f85149;
  --bd-ok:        #3fb950;
  --bd-warn:      #e3a33d;

  /* ── هوية المجموعة (تُحقن حسب تصنيف البوت) ── */
  --bd-brand:     #3b82f6;
  --bd-brand-2:   #22d3ee;
  --bd-brand-soft:rgba(59,130,246,.14);
  --bd-brand-line:rgba(59,130,246,.42);

  /* ── مقاسات ومسافات ── */
  --bd-r-xs: 8px;
  --bd-r-sm: 10px;
  --bd-r-md: 14px;
  --bd-r-lg: 20px;
  --bd-r-pill: 999px;
  --bd-sp-1: 4px;
  --bd-sp-2: 8px;
  --bd-sp-3: 12px;
  --bd-sp-4: 16px;
  --bd-sp-5: 22px;
  --bd-sp-6: 30px;
  --bd-max: 560px;

  /* ── ظلال ── */
  --bd-shadow-1: 0 1px 2px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.10);
  --bd-shadow-2: 0 10px 32px rgba(0,0,0,.28);
  --bd-glow: 0 6px 26px var(--bd-brand-soft);

  /* ── الخط ── */
  --bd-font: 'Cairo','Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  --bd-fs-xs: 11.5px;
  --bd-fs-sm: 13px;
  --bd-fs-md: 15px;
  --bd-fs-lg: 19px;
  --bd-fs-xl: 24px;

  /* ── حركة ── */
  --bd-ease: cubic-bezier(.22,.8,.28,1);
  --bd-dur-1: 120ms;
  --bd-dur-2: 220ms;
  --bd-dur-3: 380ms;

  /* ── مناطق آمنة (iPhone notch / شريط Android) ── */
  --bd-safe-top: env(safe-area-inset-top, 0px);
  --bd-safe-bottom: env(safe-area-inset-bottom, 0px);
  --bd-banner-h: 0px;

  /* ── أسماء متوافقة مع الأنماط القديمة (app_defs) ── */
  --bg: var(--bd-bg);
  --surface: var(--bd-surface);
  --text: var(--bd-text);
  --hint: var(--bd-hint);
  --accent: var(--bd-btn);
  --btn-txt: var(--bd-btn-text);
  --link: var(--bd-link);
  --danger: var(--bd-danger);
  --ok: var(--bd-ok);
  --warn: var(--bd-warn);
  --radius: var(--bd-r-md);
}

/* خلفية فاتحة احتياطية عندما لا يزوّد تيليجرام بالثيم */
@media (prefers-color-scheme: light){
  :root{
    --bd-bg:        var(--tg-theme-bg-color, #f5f7fa);
    --bd-surface:   var(--tg-theme-secondary-bg-color, #ffffff);
    --bd-text:      var(--tg-theme-text-color, #101820);
    --bd-hint:      var(--tg-theme-hint-color, #5d6b7a);
    --bd-surface-2: var(--tg-theme-section-separator-color, rgba(0,0,0,.07));
  }
}
:root{--bd-brand:#3b82f6;--bd-brand-2:#22d3ee;--bd-brand-soft:rgba(59,130,246,.15);--bd-brand-line:rgba(59,130,246,.42);}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0;
  -webkit-tap-highlight-color:transparent; }
html,body{ min-height:100%; }
html{ background:var(--bd-bg); }
body{
  font-family:var(--bd-font);
  font-size:var(--bd-fs-md);
  line-height:1.75;
  color:var(--bd-text);
  background:
    radial-gradient(1200px 520px at 50% -220px, var(--bd-brand-soft), transparent 70%),
    var(--bd-bg);
  background-attachment:fixed;
  padding:calc(14px + var(--bd-safe-top)) 14px
          calc(28px + var(--bd-banner-h) + var(--bd-safe-bottom));
  transition:background-color var(--bd-dur-3) var(--bd-ease),
             color var(--bd-dur-3) var(--bd-ease);
  overflow-x:hidden;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
.container{ max-width:var(--bd-max); margin:0 auto; }
a{ color:var(--bd-link); }

/* ── رأس التطبيق بهوية المجموعة ── */
.app-header{ position:relative; text-align:center; padding:20px 0 16px; }
.app-header::before{
  content:""; position:absolute; inset:-40px 0 auto; height:150px;
  background:radial-gradient(closest-side, var(--bd-brand-soft), transparent 78%);
  pointer-events:none; z-index:0;
}
.app-header .emoji{
  position:relative; z-index:1; display:inline-grid; place-items:center;
  width:76px; height:76px; font-size:40px; line-height:1;
  border-radius:26px;
  background:linear-gradient(145deg, var(--bd-brand-soft), transparent 70%),
             var(--bd-surface);
  border:1px solid var(--bd-brand-line);
  box-shadow:var(--bd-glow);
  animation:bd-pop var(--bd-dur-3) var(--bd-ease) both;
}
.app-header h1{
  position:relative; z-index:1; margin-top:12px;
  font-size:var(--bd-fs-xl); font-weight:800; letter-spacing:.2px;
}
.app-header p{ position:relative; z-index:1; color:var(--bd-hint);
  font-size:var(--bd-fs-sm); margin-top:2px; }

/* ── تذييل ── */
.app-footer{
  text-align:center; color:var(--bd-hint); font-size:var(--bd-fs-xs);
  margin-top:26px; line-height:2.1;
}
.app-footer a{ color:var(--bd-link); text-decoration:none; font-weight:700; }

/* ══ بطاقات ══ */
.card{
  position:relative;
  background:var(--bd-surface);
  border:1px solid var(--bd-surface-2);
  border-radius:var(--bd-r-md);
  padding:var(--bd-sp-4);
  margin-bottom:var(--bd-sp-3);
  box-shadow:var(--bd-shadow-1);
}
.card::before{
  content:""; position:absolute; inset:0 auto auto 0;
  width:100%; height:3px; border-radius:var(--bd-r-md) var(--bd-r-md) 0 0;
  background:linear-gradient(90deg, var(--bd-brand), transparent 65%);
  opacity:.75;
}
.card h2,.card-title{ font-size:var(--bd-fs-md); font-weight:800;
  margin-bottom:var(--bd-sp-3); }
.card-sub{ color:var(--bd-hint); font-size:var(--bd-fs-sm); font-weight:400;
  margin:-8px 0 12px; line-height:1.8; }

/* ══ حقول الإدخال ══ */
.field{ margin-bottom:var(--bd-sp-3); }
.field > label,label{ display:block; font-size:var(--bd-fs-sm); font-weight:700;
  color:var(--bd-hint); margin:0 0 6px 2px; }
input[type=text],input[type=number],input[type=date],input[type=tel],
input[type=url],input[type=search],textarea,select{
  width:100%; padding:12px 14px;
  border:1.5px solid var(--bd-surface-2);
  border-radius:var(--bd-r-sm);
  background:var(--bd-bg); color:var(--bd-text);
  font-size:var(--bd-fs-md); font-family:inherit; outline:none;
  transition:border-color var(--bd-dur-2) var(--bd-ease),
             box-shadow var(--bd-dur-2) var(--bd-ease);
  -webkit-appearance:none; appearance:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--bd-brand);
  box-shadow:0 0 0 3px var(--bd-brand-soft);
}
input::placeholder,textarea::placeholder{ color:var(--bd-hint); opacity:.7; }
textarea{ min-height:92px; resize:vertical; }
.field .help{ font-size:var(--bd-fs-xs); color:var(--bd-hint); margin-top:5px; }
.field.invalid input,.field.invalid textarea{ border-color:var(--bd-danger); }

/* ══ أزرار ══ */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:50px; border:none; cursor:pointer;
  background:linear-gradient(180deg, var(--bd-btn), color-mix(in srgb, var(--bd-btn) 82%, #000));
  color:var(--bd-btn-text);
  padding:13px 16px; border-radius:var(--bd-r-sm);
  font-size:15.5px; font-weight:800; font-family:inherit;
  margin-top:var(--bd-sp-3);
  box-shadow:0 6px 18px color-mix(in srgb, var(--bd-btn) 32%, transparent);
  transition:transform var(--bd-dur-1) var(--bd-ease),
             opacity var(--bd-dur-2) var(--bd-ease),
             filter var(--bd-dur-2) var(--bd-ease);
  touch-action:manipulation;
}
.btn:active{ transform:scale(.975); filter:brightness(.95); }
.btn:focus-visible{ outline:3px solid var(--bd-brand-soft); outline-offset:2px; }
.btn.secondary{ background:transparent; color:var(--bd-brand);
  border:1.5px solid var(--bd-brand-line); box-shadow:none; }
.btn.ghost{ background:var(--bd-surface-2); color:var(--bd-text); box-shadow:none; }
.btn.danger{ background:var(--bd-danger); box-shadow:none; }
.btn.small{ min-height:40px; padding:8px 14px; font-size:13.5px;
  width:auto; margin-top:0; border-radius:var(--bd-r-pill); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.btn.loading{ pointer-events:none; opacity:.8; }
.btn.loading::before{
  content:""; width:16px; height:16px; border-radius:50%;
  border:2px solid currentColor; border-top-color:transparent;
  animation:bd-spin .7s linear infinite;
}
.icon-btn{
  display:inline-grid; place-items:center; width:38px; height:38px;
  border:none; border-radius:50%; background:var(--bd-surface-2);
  color:var(--bd-text); cursor:pointer; font-size:17px;
}

/* ══ اختيارات سريعة ══ */
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.chip{
  padding:8px 14px; border-radius:var(--bd-r-pill);
  font-size:13.5px; font-weight:700; cursor:pointer; user-select:none;
  background:var(--bd-bg); color:var(--bd-text);
  border:1.5px solid var(--bd-surface-2);
  transition:background var(--bd-dur-1), color var(--bd-dur-1),
             border-color var(--bd-dur-1), transform var(--bd-dur-1);
}
.chip:active{ transform:scale(.96); }
.chip.active{ background:var(--bd-brand); color:#fff;
  border-color:var(--bd-brand); }

/* ══ تبويبات مقسّمة ══ */
.segmented{
  display:flex; gap:4px; padding:4px; border-radius:var(--bd-r-sm);
  background:var(--bd-bg); border:1px solid var(--bd-surface-2);
  margin-bottom:var(--bd-sp-3);
}
.segmented button{
  flex:1; padding:8px 10px; border:none; border-radius:calc(var(--bd-r-sm) - 3px);
  background:transparent; color:var(--bd-hint);
  font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
  transition:background var(--bd-dur-2), color var(--bd-dur-2);
}
.segmented button.active{ background:var(--bd-surface); color:var(--bd-text);
  box-shadow:var(--bd-shadow-1); }

/* ══ قوائم ══ */
.list{ display:flex; flex-direction:column; gap:8px; }
.list-item{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; border-radius:var(--bd-r-sm);
  background:var(--bd-surface); border:1px solid var(--bd-surface-2);
  transition:transform var(--bd-dur-1), border-color var(--bd-dur-2);
}
.list-item:active{ transform:scale(.99); border-color:var(--bd-brand-line); }
.list-item .li-icon{
  display:grid; place-items:center; flex:0 0 auto;
  width:44px; height:44px; border-radius:13px; font-size:21px;
  background:var(--bd-brand-soft);
}
.list-item .li-body{ flex:1; min-width:0; }
.list-item .li-body b{ display:block; font-size:14px; }
.list-item .li-body span{ display:block; color:var(--bd-hint);
  font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-item .li-chevron{ color:var(--bd-hint); font-size:20px; }

/* ══ إحصائيات ══ */
.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  margin-top:12px; }
.stat{
  background:var(--bd-bg); border:1px solid var(--bd-surface-2);
  border-radius:var(--bd-r-sm); padding:10px 8px; text-align:center;
}
.stat b{ display:block; font-size:18px; font-weight:800; }
.stat span{ font-size:11px; color:var(--bd-hint); }
.stat.accent b{ color:var(--bd-brand); }

/* ══ شعارات/وسوم ══ */
.badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 9px; border-radius:var(--bd-r-pill);
  font-size:10.5px; font-weight:800;
  background:var(--bd-brand-soft); color:var(--bd-brand);
  vertical-align:middle;
}
.badge.ok{ background:rgba(63,185,80,.14); color:var(--bd-ok); }
.badge.warn{ background:rgba(227,163,61,.16); color:var(--bd-warn); }
.badge.muted{ background:var(--bd-surface-2); color:var(--bd-hint); }

/* ══ شريط تقدم ══ */
.progress{ height:8px; border-radius:var(--bd-r-pill);
  background:var(--bd-surface-2); overflow:hidden; }
.progress > i{ display:block; height:100%; width:0;
  border-radius:inherit; background:linear-gradient(90deg, var(--bd-brand), var(--bd-brand-2));
  transition:width var(--bd-dur-3) var(--bd-ease); }
.progress.indeterminate > i{ width:38%; animation:bd-indeterminate 1.2s var(--bd-ease) infinite; }

/* ══ هياكل تحميل ══ */
.skeleton{
  border-radius:var(--bd-r-sm); min-height:16px;
  background:linear-gradient(100deg, var(--bd-surface-2) 30%,
             var(--bd-surface) 50%, var(--bd-surface-2) 70%);
  background-size:220% 100%;
  animation:bd-shimmer 1.35s linear infinite;
}
.skeleton.lines > *{ height:12px; margin-bottom:8px; }

/* ══ حالة فراغ ══ */
.empty{ text-align:center; padding:26px 16px; color:var(--bd-hint); }
.empty .big{ font-size:38px; margin-bottom:6px; }
.empty b{ display:block; color:var(--bd-text); margin-bottom:3px; }

/* ══ نتيجة ══ */
.result{
  margin-top:14px; padding:16px; border-radius:var(--bd-r-md);
  background:var(--bd-bg);
  border:1.5px dashed var(--bd-brand-line);
  font-size:15px; line-height:2; display:none; word-break:break-word;
}
.result.show{ display:block; animation:bd-fade-up var(--bd-dur-3) var(--bd-ease) both; }
.result-title{ display:flex; align-items:center; gap:8px; font-weight:800;
  font-size:16px; margin-bottom:8px; color:var(--bd-brand); }
.result-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.result-actions .btn{ margin-top:0; flex:1; min-width:130px; }

/* ══ ورقة سفلية ══ */
.sheet-backdrop{
  position:fixed; inset:0; z-index:150; display:none;
  background:rgba(0,0,0,.55); backdrop-filter:blur(4px);
}
.sheet-backdrop.show{ display:block; animation:bd-fade var(--bd-dur-2) both; }
.sheet{
  position:fixed; inset:auto 0 0; z-index:151;
  max-width:var(--bd-max); margin:0 auto;
  background:var(--bd-surface);
  border-radius:var(--bd-r-lg) var(--bd-r-lg) 0 0;
  padding:20px 18px calc(20px + var(--bd-safe-bottom));
  box-shadow:var(--bd-shadow-2);
  transform:translateY(105%);
  transition:transform var(--bd-dur-3) var(--bd-ease);
}
.sheet.show{ transform:translateY(0); }
.sheet .grabber{ width:42px; height:4px; border-radius:99px;
  background:var(--bd-surface-2); margin:0 auto 14px; }

/* ══ توست ══ */
#toast{
  position:fixed; left:50%; bottom:calc(24px + var(--bd-banner-h) + var(--bd-safe-bottom));
  transform:translate(-50%,18px); z-index:300;
  background:var(--bd-text); color:var(--bd-bg);
  padding:10px 20px; border-radius:var(--bd-r-pill);
  font-size:13.5px; font-weight:700; opacity:0; pointer-events:none;
  transition:opacity var(--bd-dur-2), transform var(--bd-dur-2);
  max-width:88vw; text-align:center;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

/* ══ إعلان البانر السفلي (ثابت) ══ */
.ad-banner{
  position:fixed; inset:auto 0 0; z-index:120;
  display:none; align-items:center; gap:10px;
  padding:9px 12px calc(9px + var(--bd-safe-bottom));
  background:color-mix(in srgb, var(--bd-surface) 94%, transparent);
  border-top:1px solid var(--bd-brand-line);
  box-shadow:0 -8px 26px rgba(0,0,0,.22);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.ad-banner.show{ display:flex; animation:bd-slide-up var(--bd-dur-3) var(--bd-ease) both; }
.ad-banner .ad-icon{ font-size:19px; flex:0 0 auto; }
.ad-banner .ad-text{ flex:1; min-width:0; font-size:12.5px; line-height:1.6; }
.ad-banner .ad-text a{ color:var(--bd-link); font-weight:800; text-decoration:none; }
.ad-banner .ad-close{
  flex:0 0 auto; width:28px; height:28px; border:none; border-radius:50%;
  background:var(--bd-surface-2); color:var(--bd-hint);
  font-size:14px; cursor:pointer; line-height:1;
}
.ad-banner .ad-label{
  font-size:9px; letter-spacing:.8px; color:var(--bd-hint);

@keyframes bd-pop{
  from{ opacity:0; transform:scale(.86); }
  to{ opacity:1; transform:scale(1); }
}
@keyframes bd-fade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes bd-fade-up{
  from{ opacity:0; transform:translateY(10px); }

}
@keyframes bd-slide-up{
  from{ opacity:0; transform:translateY(24px); }

}
@keyframes bd-spin{ to{ transform:rotate(360deg); } }
@keyframes bd-shimmer{ to{ background-position:-220% 0; } }
@keyframes bd-indeterminate{

  100%{ transform:translateX(330%); }
}
@keyframes bd-pulse{
  0%,100%{ transform:scale(1); opacity:1; }

.stagger > *:nth-child(1){ animation-delay:30ms; }

/* احترام تفضيل تقليل الحركة — إلزامي */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;

    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }

}

<script>
/* ═════════ Boda MiniApp SDK v2 ═════════
   Telegram-native + Design System + Ads placement
   لا يحتوي أي توكن — التكامل عبر Telegram.WebApp الرسمي فقط. */
(function () {
  'use strict';

  var API_BASE = window.__BODA_API__ || '';
  var BOT_ID   = window.__BODA_BOT_ID__ || 'unknown';
  var SHARE    = window.__BODA_SHARE__ || 'https://t.me/BodaStoreeBot';
  var tg       = (window.Telegram && window.Telegram.WebApp) || null;

  /* ── تهيئة تيليجرام والثيم ── */
  function applyTheme() {
    if (!tg || !tg.themeParams) return;
    var p = tg.themeParams, r = document.documentElement.style;
    if (p.bg_color)            r.setProperty('--tg-theme-bg-color', p.bg_color);
    if (p.secondary_bg_color)  r.setProperty('--tg-theme-secondary-bg-color', p.secondary_bg_color);
    if (p.text_color)          r.setProperty('--tg-theme-text-color', p.text_color);
    if (p.hint_color)          r.setProperty('--tg-theme-hint-color', p.hint_color);
    if (p.link_color)          r.setProperty('--tg-theme-link-color', p.link_color);
    if (p.button_color)        r.setProperty('--tg-theme-button-color', p.button_color);
    if (p.button_text_color)   r.setProperty('--tg-theme-button-text-color', p.button_text_color);
    var scheme = tg.colorScheme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', scheme);
    document.documentElement.style.colorScheme = scheme;
  }

  function initTelegram() {
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('secondary_bg_color');
      if (tg.setBackgroundColor) tg.setBackgroundColor('secondary_bg_color');
      if (tg.onEvent) tg.onEvent('themeChanged', applyTheme);
      applyTheme();
    } catch (e) {}
  }

  /* ── المستخدم (بيانات عرض فقط — لا تُستخدم للتحقق) ── */
  function getUser() {
    try {
      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!u) return null;
      return { id: u.id, name: [u.first_name, u.last_name].filter(Boolean).join(' ') };
    } catch (e) { return null; }
  }

  function initData() { try { return (tg && tg.initData) || ''; } catch (e) { return ''; } }

  /* بيئة تيليجرام الحقيقية فقط — مكتبة telegram-web-app.js تُحمّل حتى خارج تيليجرام */
  function isTelegram() {
    try {
      if (!tg) return false;
      if (tg.initData) return true;
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) return true;
      return !!(tg.platform && tg.platform !== 'unknown');
    } catch (e) { return false; }
  }

  /* ── التتبع (best-effort، لا يعطّل الواجهة) ── */
  function track(event, extra) {
    try {
      var u = getUser();
      var payload = Object.assign({
        bot: BOT_ID, event: event, user_id: u ? u.id : 0
      }, extra || {});
      var raw = initData();
      if (raw) payload.init_data = raw;
      if (API_BASE) {
        fetch(API_BASE + '/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(function () {});
      }
      try {
        var k = 'boda_events';
        var arr = JSON.parse(localStorage.getItem(k) || '[]');
        arr.push(Object.assign({ t: Date.now() }, payload));
        localStorage.setItem(k, JSON.stringify(arr.slice(-50)));
      } catch (e) {}
    } catch (e) {}
  }

  /* ── نداء API مع initData (للعمليات الحساسة لاحقاً) ── */
  function api(path, body) {
    var payload = Object.assign({}, body || {});
    var raw = initData();
    if (raw) payload.init_data = raw;
    return fetch((API_BASE || '') + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  /* ── اهتزاز ── */
  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'success' || kind === 'error' || kind === 'warning') {
        tg.HapticFeedback.notificationOccurred(kind);
      } else if (kind === 'select') {
        tg.HapticFeedback.selectionChanged();
      } else {
        tg.HapticFeedback.impactOccurred(kind || 'light');
      }
    } catch (e) {}
  }

  /* ── توست ── */
  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 2300);
  }

  /* ── نسخ ── */
  function copy(text, okMsg) {
    function done() { toast(okMsg || '✅ تم النسخ'); haptic('success'); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove();
      done();
    }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(fallback);
    else fallback();
  }

  /* ── مشاركة ── */
  function share(text, url) {
    var link = url || SHARE;
    var full = text + '\n\n' + link;
    try {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink('https://t.me/share/url?url=' +
          encodeURIComponent(link) + '&text=' + encodeURIComponent(text));
      } else if (navigator.share) {
        navigator.share({ text: full });
      } else {
        copy(full, '📋 انسخه وشاركه');
        return;
      }
    } catch (e) { copy(full, '📋 انسخه وشاركه'); }
    track('share');
  }

  /* ── MainButton / BackButton أصليّان ── */
  var mainCb = null;
  var MainButton = {
    set: function (text, onClick) {
      if (!tg || !tg.MainButton || !isTelegram()) return false;
      try {
        tg.MainButton.setText(text || '');
        /* إزالة المستمع السابق حتى لا تتراكم الأفعال عند تغيير النص */
        if (mainCb && tg.MainButton.offClick) {
          try { tg.MainButton.offClick(mainCb); } catch (e) {}
        }
        mainCb = onClick || function () {};
        tg.MainButton.onClick(mainCb);
        tg.MainButton.show();
        return true;
      } catch (e) { return false; }
    },
    hide: function () { try { tg.MainButton.hide(); } catch (e) {} },
    progress: function (on) {
      if (!isTelegram()) return;
      try { on ? tg.MainButton.showProgress(true) : tg.MainButton.hideProgress(); }
      catch (e) {}
    },
    disable: function (on) {
      if (!isTelegram()) return;
      try { on ? tg.MainButton.disable() : tg.MainButton.enable(); } catch (e) {}
    }
  };

  var BackButton = {
    show: function (onClick) {
      if (!tg || !tg.BackButton || !isTelegram()) return false;
      try {
        tg.BackButton.onClick(onClick || function () { tg.close(); });
        tg.BackButton.show();
        return true;
      } catch (e) { return false; }
    },
    hide: function () { try { tg.BackButton.hide(); } catch (e) {} }
  };

  /* ── CloudStorage مع بديل محلي ── */
  var Cloud = {
    get: function (key) {
      return new Promise(function (resolve) {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem(key, function (err, val) {
            if (!err && val) resolve(val);
            else resolve(localStorage.getItem('boda_cloud_' + key));
          });
        } else resolve(localStorage.getItem('boda_cloud_' + key));
      });
    },
    set: function (key, value) {
      return new Promise(function (resolve) {
        try { localStorage.setItem('boda_cloud_' + key, String(value)); } catch (e) {}
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem(key, String(value), function () { resolve(true); });
        } else resolve(true);
      });
    }
  };

  /* ═════════ الإعلانات ═════════ */
  var Ad = {
    cfg: window.__BODA_ADS__ || { banner: null, sponsor: null, every: 3 },
    _lastInterstitial: 0,

    /** بانر ثابت أسفل الشاشة — يُغلق مؤقتاً في هذه الجلسة */
    mountBanner: function () {
      var b = this.cfg.banner;
      if (!b || !b.html) return;
      try { if (sessionStorage.getItem('boda_banner_closed') === '1') return; } catch (e) {}

      var el = document.createElement('div');
      el.className = 'ad-banner';
      el.setAttribute('role', 'complementary');
      el.setAttribute('aria-label', 'محتوى برعاية');
      el.innerHTML =
        '<span class="ad-icon">' + (b.icon || '📢') + '</span>' +
        '<div class="ad-text">' + b.html +
        '<span class="ad-label">AD</span></div>' +
        '<button class="ad-close" type="button" aria-label="إغلاق الإعلان">✕</button>';

      document.body.appendChild(el);

      function show() {
        el.classList.add('show');
        var h = el.offsetHeight || 52;
        document.documentElement.style.setProperty('--bd-banner-h', h + 'px');
        track('ad_view', { placement: 'banner', format: 'fixed_bottom' });
      }
      setTimeout(show, 700);

      el.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
          track('ad_click', { placement: 'banner' });
          haptic('light');
        });
      });
      el.querySelector('.ad-close').addEventListener('click', function () {
        el.remove();
        document.documentElement.style.setProperty('--bd-banner-h', '0px');
        try { sessionStorage.setItem('boda_banner_closed', '1'); } catch (e) {}
      });
    },

    /** يُستدعى بعد اكتمال النتيجة فقط — ليس أثناء العملية */
    afterResult: function () {
      var s = this.cfg.sponsor;
      if (!s) return;
      var every = Math.max(1, parseInt(this.cfg.every || 3, 10));
      var n = 0;
      try {
        n = (parseInt(localStorage.getItem('boda_results_' + BOT_ID) || '0', 10) || 0) + 1;
        localStorage.setItem('boda_results_' + BOT_ID, n);
      } catch (e) { n = 1; }
      if (n % every !== 0) return;
      if (Date.now() - this._lastInterstitial < 90000) return;
      this._lastInterstitial = Date.now();
      this.showInterstitial(s);
    },

    showInterstitial: function (s) {
      var old = document.getElementById('sponsor-overlay');
      if (old) old.remove();
      var ov = document.createElement('div');
      ov.id = 'sponsor-overlay';
      ov.setAttribute('role', 'dialog');
      ov.setAttribute('aria-modal', 'true');
      ov.innerHTML =
        '<div class="sponsor-card">' +
        '<span class="sp-badge">✦ SPONSORED</span>' +
        '<h3></h3><p></p>' +
        '<button class="btn" id="sp-go" type="button"></button>' +
        '<button class="skip" type="button" disabled></button>' +
        '</div>';
      ov.querySelector('h3').textContent = s.title || '';
      ov.querySelector('p').textContent = s.text || '';
      ov.querySelector('#sp-go').textContent = (s.button || 'زيارة الراعي') + ' ↗';
      document.body.appendChild(ov);
      requestAnimationFrame(function () { ov.classList.add('show'); });
      haptic('light');
      track('ad_view', { placement: 'interstitial', format: 'after_result' });

      function close() {
        ov.classList.remove('show');
        setTimeout(function () { ov.remove(); }, 240);
      }
      ov.querySelector('#sp-go').addEventListener('click', function () {
        track('ad_click', { placement: 'interstitial' });
        haptic('success');
        try {
          if (tg && tg.openLink) tg.openLink(s.url);
          else window.open(s.url, '_blank');
        } catch (e) {}
        close();
      });

      var skip = ov.querySelector('.skip');
      var left = 3;
      skip.textContent = 'يمكنك المتابعة بعد ' + left + '…';
      var timer = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          clearInterval(timer);
          skip.disabled = false;
          skip.textContent = 'متابعة للتطبيق ←';
        } else {
          skip.textContent = 'يمكنك المتابعة بعد ' + left + '…';
        }
      }, 1000);
      skip.addEventListener('click', function () {
        if (!skip.disabled) { clearInterval(timer); close(); }
      });
    },

    /* توافق خلفي: لم يعد يظهر عند فتح التطبيق */
    maybeSponsor: function () { /* intentionally no-op */ }
  };

  /* ── رصد اكتمال النتائج تلقائياً في كل التطبيقات ── */
  function observeResults() {
    function onShown(el) {
      if (el._bodaCounted) return;
      el._bodaCounted = true;
      Ad.afterResult();
    }
    function scan(root) {
      var nodes = [];
      if (root.nodeType === 1 && root.classList && root.classList.contains('result')) {
        nodes.push(root);
      }
      if (root.querySelectorAll) {
        root.querySelectorAll('.result').forEach(function (el) { nodes.push(el); });
      }
      nodes.forEach(function (el) {
        if (el._bodaObserved) return;
        el._bodaObserved = true;
        if (el.classList.contains('show')) onShown(el);
        new MutationObserver(function (muts) {
          muts.forEach(function (m) {
            if (m.target.classList && m.target.classList.contains('show')) onShown(m.target);
          });
        }).observe(el, { attributes: true, attributeFilter: ['class'] });
      });
    }
    scan(document);
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        m.addedNodes.forEach(function (n) {
          if (n.nodeType === 1) scan(n);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* ── تشغيل ── */
  function boot() {
    initTelegram();
    Ad.mountBanner();
    observeResults();
    track('app_open');
    document.documentElement.classList.add('boda-ready');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  }

  window.Boda = {
    track: track, api: api, toast: toast, haptic: haptic, copy: copy, share: share,
    getUser: getUser, initData: initData, ready: ready, tg: tg,
    isTelegram: isTelegram,
    MainButton: MainButton, BackButton: BackButton, Cloud: Cloud, Ad: Ad
  };
})();

<script>
const POPULAR=['USD','EUR','GBP','EGP','SAR','AED','KWD','QAR','TRY','JPY'];
const SHARE_BOT='https://t.me/BodaCurrencyBot';
let RATES=null, cacheT=0;
const fmt=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});

async function loadRates(){
  if (RATES && Date.now()-cacheT < 600000) return RATES;
  const go=document.getElementById('go');
  if(go){ go.disabled=true; go.classList.add('loading'); }
  Boda.toast('⏳ تحميل الأسعار...');
  try{
    const r=await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    if(!r.ok) throw 0;
    RATES=(await r.json()).rates; cacheT=Date.now();
  }catch(e){
    Boda.haptic('error');
    Boda.toast('⚠️ تعذر تحميل الأسعار — تحقق من الاتصال');
  }finally{
    if(go){ go.disabled=false; go.classList.remove('loading'); }
  }
  return RATES;
}

function fill(sel, chipsEl){
  const s=document.getElementById(sel), c=document.getElementById(chipsEl);
  const codes=Object.keys(RATES).sort();
  s.innerHTML=codes.map(x=>'<option>'+x+'</option>').join('');
  const draw=()=>{
    c.innerHTML=POPULAR.map(x=>
      '<span class="chip'+(s.value===x?' active':'')+'" data-code="'+x+'">'+x+'</span>').join('');
    c.querySelectorAll('.chip').forEach(el=>{
      el.onclick=()=>setVal(sel, el.dataset.code);
    });
  };
  s.onchange=draw; draw();
}

function setVal(sel,v){
  const el=document.getElementById(sel);
  el.value=v;
  el.dispatchEvent(new Event('change'));
}

async function convert(){
  const amt=parseFloat(document.getElementById('amount').value);
  const from=document.getElementById('from').value;
  const to=document.getElementById('to').value;
  if(!amt||amt<=0){ Boda.haptic('warning'); return Boda.toast('⚠️ أدخل مبلغاً صحيحاً'); }
  Boda.haptic('light');
  Boda.MainButton.progress(true);
  const rates=await loadRates();
  Boda.MainButton.progress(false);
  if(!rates||!rates[from]||!rates[to]) return;
  const out=amt/rates[from]*rates[to], rate=rates[to]/rates[from];
  const res=document.getElementById('res');
  res.className='result show';
  res.innerHTML=
    '<div class="result-title">✅ نتيجة التحويل</div>'+
    '<div style="font-size:22px;font-weight:800;line-height:1.7">'+
      fmt(amt)+' '+from+' = <span style="color:var(--bd-brand)">'+fmt(out)+' '+to+'</span></div>'+
    '<div class="muted" style="font-size:12.5px">1 '+from+' = '+rate.toFixed(4)+' '+to+'</div>'+
    '<div class="result-actions">'+
      '<button class="btn secondary" id="copy-btn" type="button">📋 نسخ النتيجة</button>'+
      '<button class="btn secondary" id="share-btn" type="button">📤 مشاركة</button>'+
    '</div>';
  res.querySelector('#copy-btn').onclick=()=>Boda.copy(fmt(out)+' '+to, '📋 تم نسخ النتيجة');
  res.querySelector('#share-btn').onclick=()=>
    Boda.share('💱 '+fmt(amt)+' '+from+' = '+fmt(out)+' '+to+' — جرّب محول العملات', SHARE_BOT);
  Boda.haptic('success');
  Boda.track('feature_use',{detail:'convert'});
  Boda.Cloud.set('currency_pair', from+'>'+to);
  const behavior=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
  res.scrollIntoView({behavior:behavior, block:'nearest'});
}

Boda.ready(async ()=>{
  const rates=await loadRates();
  if(!rates) return;
  fill('from','from-chips'); fill('to','to-chips');
  setVal('from','USD'); setVal('to','EGP');
  try{
    const saved=await Boda.Cloud.get('currency_pair');
    if(saved && saved.indexOf('>')>0){
      const parts=saved.split('>');
      if(rates[parts[0]]&&rates[parts[1]]){ setVal('from',parts[0]); setVal('to',parts[1]); }
    }
  }catch(e){}
  if(Boda.MainButton.set('🔄 تحويل الآن', convert)){
    const b=document.getElementById('go'); if(b) b.style.display='none';
  }
});
</script>
