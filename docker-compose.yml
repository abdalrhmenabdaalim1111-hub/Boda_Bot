version: '3.8'

services:
  # مشغل البوتات المركزي
  boda-bots:
    build: .
    container_name: boda_bot_runner
    restart: unless-stopped
    command: python StartManager.py
    env_file:
      - .env
    volumes:
      - ./Data:/app/Data
      - ./Logs:/app/Logs
      - ./Backups:/app/Backups
    networks:
      - boda-network

  # خادم المراقبة وواجهة API وفحص الصحة
  boda-api:
    build: .
    container_name: boda_bot_api
    restart: unless-stopped
    command: python api_server.py --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./Data:/app/Data
      - ./Logs:/app/Logs
      - ./bots_registry.json:/app/bots_registry.json:ro
    networks:
      - boda-network

networks:
  boda-network:
    driver: bridge

