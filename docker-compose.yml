services:
  # مشغل البوتات المركزي
  boda-bots:
    build: .
    container_name: boda_bot_runner
    restart: unless-stopped
    command: python StartManager.py
    env_file:
      - .env
    volumes:
      - ./Data:/app/Data
      - ./Logs:/app/Logs
      - ./Backups:/app/Backups
    ports:
      # منفذ الوِبهُوك (يُستخدم فقط عند ضبط USE_WEBHOOK=true في .env)
      - "8443:8443"
    networks:
      - boda-network
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil,sys; sys.exit(0 if any('StartManager' in ' '.join(p.info.get('cmdline') or []) for p in psutil.process_iter(['cmdline']) if p.pid != 1) else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # خادم المراقبة وواجهة API وفحص الصحة
  boda-api:
    build: .
    container_name: boda_bot_api
    restart: unless-stopped
    command: python api_server.py --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./Data:/app/Data
      - ./Logs:/app/Logs
      - ./bots_registry.json:/app/bots_registry.json:ro
      - ./webroot:/app/webroot:ro
    networks:
      - boda-network

networks:
  boda-network:
    driver: bridge

